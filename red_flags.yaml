version: 4
updated: '2026-11-18'
source: Клинические алгоритмы неотложной помощи; список проверяется врачом при каждой
  ревизии
flags:
- id: chest_pain_dyspnea
  match: all
  patterns:
  - - боль в груди
    - больно в груди
    - болит в груди
    - болит за грудиной
    - больно за грудиной
    - давит в груди
    - давит за грудиной
    - жжёт в груди
    - жжет в груди
    - жжение за грудиной
    - жжёт за грудиной
    - грудь сжало
    - сдавило грудь
    - сердце разрыва
    - грудная боль
  - - одыш
    - не могу дышать
    - тяжело дышать
    - дышать трудно
    - дышать тяжело
    - задыха
    - воздуха не хватает
    - воздуха не хватае
  except:
  - нет одышк
  - одышки нет
  - без одышк
  - не задыха
  - 'одышки не '
  - нет боли
  - не болит
  - без боли
  message: боль в груди с одышкой — возможен инфаркт/тромбоэмболия
- id: stroke
  match: any
  patterns:
  - - перекосило
    - асимметрия лица
    - уголок рта
    - не может улыбнуться
    - не закрывается глаз
    - лицо с одной стороны
  - - слабость в руке
    - слабость в ноге
    - онемел
    - немеет
    - онемение половины
    - отнял
    - не слушается рука
    - не слушается нога
    - не слушается правая
    - не слушается левая
    - чашку не удержать
  - - речь стала невнятной
    - невнятная речь
    - не может говорить
    - нарушение речи
    - смазан
    - язык заплетается
    - слова не идут
    - не может выговорить
  message: признаки инсульта — счёт идёт на минуты
- id: severe_bleeding
  match: any
  patterns:
  - - сильное кровотечение
    - кровь не останавливается
    - артериальн
    - рвота с кровью
    - кровь в стуле
    - дёгтеобразный стул
  message: сильное кровотечение
- id: unconsciousness
  match: any
  patterns:
  - - потерял сознание
    - потеряла сознание
    - обморок
    - не приходит в себя
  message: потеря сознания
- id: fever_rash_stiff
  match: all
  patterns:
  - - температур
  - - сыпь
    - ригидность затылка
    - не может пригнуть голову
    - болит затылок
  message: высокая температура с сыпью/ригидностью затылка — возможен менингит
- id: seizures
  match: any
  patterns:
  - - судорог
    - припадок
    - конвульс
  message: судороги
- id: severe_breathing
  match: any
  patterns:
  - - удуш
    - не может дышать
    - острая нехватка воздуха
    - синеют губы
    - цианоз
  message: острая дыхательная недостаточность
- id: dehydration
  match: all
  patterns:
  - - неукротимая рвота
    - рвота не прекращается
    - многократная рвота
    - рвоту 5
    - рвота уже
  - - моча тёмная
    - мало мочи
    - не моч
    - сухой язык
    - сильно сохнет во рту
  message: рвота с признаками обезвоживания
