version: 9
updated: '2026-11-19'
source: Клинические алгоритмы неотложной помощи; список проверяется врачом при каждой
  ревизии
flags:
- id: chest_pain_dyspnea
  match: all
  patterns:
  - - боль в груди
    - больно в груди
    - болит в груди
    - болит за грудиной
    - больно за грудиной
    - давит в груди
    - давит за грудиной
    - жжёт в груди
    - жжет в груди
    - жжение за грудиной
    - жжёт за грудиной
    - грудь сжало
    - сдавило грудь
    - сердце разрыва
    - грудная боль
  - - одыш
    - не могу дышать
    - тяжело дышать
    - дышать трудно
    - дышать тяжело
    - задыха
    - воздуха не хватает
    - воздуха не хватае
  except:
  - нет одышк
  - одышки нет
  - без одышк
  - не задыха
  - 'одышки не '
  - нет боли
  - не болит
  - без боли
  message: боль в груди с одышкой — возможен инфаркт/тромбоэмболия
- id: stroke
  match: any
  patterns:
  - - перекосило
    - асимметрия лица
    - уголок рта
    - не может улыбнуться
    - не закрывается глаз
    - лицо с одной стороны
  - - слабость в руке
    - слабость в ноге
    - онемел
    - онемение половины
    - отнял
    - не слушается рука
    - не слушается нога
    - не слушается правая
    - не слушается левая
    - чашку не удержать
    - немеет половина
    - немеет лицо
    - немеет рука
    - немеет нога
    - немеют руки
    - немеют ноги
    - онемела рука
    - онемела нога
  - - речь стала невнятной
    - невнятная речь
    - не может говорить
    - нарушение речи
    - смазан
    - язык заплетается
    - слова не идут
    - не может выговорить
  - - рука не работает
    - не работает рука
    - руки не работают
    - нога не работает
    - не работает нога
    - ноги не работают
  - - рука чужая
    - нога чужая
    - не моя рука
    - ноги не идут
    - ноги ватные
    - висит плетью
    - рука висит плетью
  - - половина лица
    - половинка лица
    - половина тела
    - половинку лица
  - - прищур
    - глаз прищурен
    - веко опустилось
  - - не понимаю, что мне говорят
    - речи не понимаю
    - не понимаю обращённую речь
    - не понимаю обращенную речь
  - - рука не слушается
    - не слушается рука
    - руки не слушаются
    - нога не слушается
    - не слушается нога
    - ноги не слушаются
    - не слушается язык
    - не слушается правая
    - не слушается левая
  - - заплетается
    - речь нарушилась
    - перекошено
    - перекошено лицо
    - не может держать кружку
    - не может держать ложку
  - - поплыла походка
    - нарушена координация
    - не может стоять
    - как пьяный
    - как пьяная
    - упал без причины
  message: признаки инсульта — счёт идёт на минуты
  except:
  - проспал руку
  - проспала руку
  - отлежал
  - отлежала
  - затек
  - затекло
  - пересидел
  - пересидела
  - после тренировки
  - после сна
  - после укола
  - постепенно
  - уже месяц
  - уже неделю
  - уже год
- id: severe_bleeding
  match: any
  patterns:
  - - сильное кровотечение
    - кровь не останавливается
    - артериальн
    - рвота с кровью
    - кровь в стуле
    - дёгтеобразный стул
  message: сильное кровотечение
- id: unconsciousness
  match: any
  patterns:
  - - потерял сознание
    - потеряла сознание
    - обморок
    - не приходит в себя
  message: потеря сознания
- id: fever_rash_stiff
  match: all
  patterns:
  - - температур
  - - сыпь
    - ригидность затылка
    - не может пригнуть голову
    - болит затылок
  message: высокая температура с сыпью/ригидностью затылка — возможен менингит
- id: seizures
  match: any
  patterns:
  - - судорог
    - припадок
    - конвульс
  message: судороги
- id: severe_breathing
  match: any
  patterns:
  - - удуш
    - не может дышать
    - острая нехватка воздуха
    - синеют губы
    - цианоз
  message: острая дыхательная недостаточность
- id: dehydration
  match: all
  patterns:
  - - неукротимая рвота
    - рвота не прекращается
    - многократная рвота
    - рвоту 5
    - рвота уже
  - - моча тёмная
    - мало мочи
    - не моч
    - сухой язык
    - сильно сохнет во рту
  message: рвота с признаками обезвоживания
- id: severe_dyspnea
  title: Выраженная одышка / удушье
  match: any
  patterns:
  - - не могу дышать
    - плохо дышать
    - очень плохо дышать
    - тяжело дышать
    - дышать трудно
    - дышать тяжело
    - задыха
    - воздуха не хватает
    - воздуха не хватае
    - дыхание сбилось
    - не могу вдохнуть
  except:
  - легко дышать
  - дышится легко
  - дышу нормально
  message: Выраженная одышка — возможна дыхательная недостаточность. Не откладывайте
    обращение за помощью; при резком ухудшении — скорая (103/112).
- id: hypotension
  title: Резкое падение давления / предобморок
  match: any
  patterns:
  - - давление низкое
    - низкое давление
    - давление упало
    - давление 80
    - давление 90
    - давление 70
    - потемнело в глазах
    - предобморочное
    - почти упал в обморок
    - падаю в обморок
  except: []
  message: Резкое падение давления / предобморочное состояние — требуется оценка врача;
    при потере сознания или нарастающей слабости — скорая (103/112).
- id: stroke_vision
  match: any
  patterns:
  - - перестал видеть
    - потеря зрения
    - ослеп
    - ослепла
    - не вижу одним глазом
    - потемнело в одном глазу
    - двоится в глазах
  except: []
  message: внезапная потеря зрения или двоение — возможна ТИА/инсульт, нужен врач
    сейчас
- id: stroke_brainstem
  match: all
  patterns:
  - - пропал голос
    - голос осип
  - - координац
    - шатает
    - походк
    - двоится
    - кружится голова
  except:
  - осип
  - осипла
  - болит горло
  - кашель
  message: внезапная потеря голоса с нарушением координации — возможен инсульт/ТИА,
    срочно к врачу
- id: eye_vision_loss_emergency
  match: all
  patterns:
  - - резко упало зрение
    - зрение упало
    - зрение снизилось
    - перестал видеть
    - потеря зрения
    - ослеп
    - ослепла
    - туман перед глазом
    - пелена перед глазом
    - двоится в глазах
    - сузилось поле зрения
  - - болит глаз
    - глаз болит
    - боль в глазу
    - глаз режет
    - глаз распирает
    - распирает
    - светобоязн
    - больно смотреть на свет
    - свет раздражает
  except:
  - после сна прошло
  - отдохнул и прошло
  message: 'Падение зрения с болью в глазу — осмотр офтальмолога сегодня. Возможен
    острый приступ глаукомы или кератит: это часы, не дни.'
- id: eye_photophobia_pain
  match: all
  patterns:
  - - светобоязн
    - больно смотреть на свет
    - свет раздражает глаз
    - свет режет глаз
  - - болит глаз
    - глаз болит
    - боль в глазу
    - глаз режет
    - глаз распирает
    - распирает
    - больно моргать
    - гнойное отделяемое
    - гноится
  except: []
  message: Светобоязнь с болью в глазу — к офтальмологу сегодня, возможен кератит
    или увеит.
